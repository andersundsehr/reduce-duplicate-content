name: Tasks

on: [push, pull_request]

jobs:
  lint-php:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            typo3: '13'
          - php: '8.3'
            typo3: '13'
          - php: '8.4'
            typo3: '13'
          - php: '8.5'
            typo3: '13'
          # phpro/grumphp does not allow PHP 8.6 yet
          - php: '8.6'
            typo3: '13'
            ignorePlatformReqs: '--ignore-platform-req=php+'
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php }}-composer-
      - run: composer require typo3/minimal="^${{ matrix.typo3 }}.4" --dev --with-all-dependencies --no-interaction --no-progress ${{ matrix.ignorePlatformReqs }}
      # --ignore-platform-req=php+ may only skip the PHP check of dev dependencies (e.g. phpro/grumphp)
      - if: matrix.php == '8.6'
        run: composer check-platform-reqs --no-dev
      - run: ./vendor/bin/grumphp run --ansi
